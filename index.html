<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CKJ - Plateforme</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0f0f0f;color:#fff;margin:0;padding:15px}
h1{text-align:center;color:#FFD700}
.card{background:#1e1e1e;border-radius:15px;padding:15px;margin-bottom:20px;border:1px solid #333}
.card img{width:100%;height:200px;object-fit:cover;border-radius:10px}
.btn{width:100%;padding:12px;border:none;border-radius:10px;background:#FFD700;font-weight:bold;font-size:16px;cursor:pointer;margin-top:10px}
.count{font-size:18px;text-align:center;margin-top:10px}
.count b{color:#FFD700;font-size:24px}
input,textarea{width:100%;padding:10px;border-radius:10px;border:none;margin-top:8px;background:#2a2a2a;color:#fff}
.msg{background:#2a2a2a;padding:10px;border-radius:10px;margin-top:8px}
.msg b{color:#FFD700}
small{color:#aaa}
</style>
</head>
<body>

<h1>⭐ CKJ PLATEFORME ⭐</h1>
<p style="text-align:center">Clique pour soutenir ton artiste et laisse-lui un message</p>

<div id="artists"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, runTransaction, push, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCHXhEHpra0zFJl3dqHih0_BQVZTOCILPI",
  authDomain: "ckj-plateforme.firebaseapp.com",
  databaseURL: "https://ckj-plateforme-default-rtdb.firebaseio.com",
  projectId: "ckj-plateforme",
  storageBucket: "ckj-plateforme.firebasestorage.app",
  messagingSenderId: "635659464722",
  appId: "1:635659464722:web:db19f30f1aa07546e4a8cb"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const artistes = [
  { id: "artiste1", nom: "Artiste 1", photo: "https://via.placeholder.com/600x400?text=Artiste+1" },
  { id: "artiste2", nom: "Artiste 2", photo: "https://via.placeholder.com/600x400?text=Artiste+2" },
  { id: "artiste3", nom: "Artiste 3", photo: "https://via.placeholder.com/600x400?text=Artiste+3" },
];

const container = document.getElementById("artists");

artistes.forEach(a => {
  const div = document.createElement("div");
  div.className = "card";
  div.innerHTML = `
    <img src="${a.photo}">
    <h2>${a.nom}</h2>
    <div class="count">❤️ Clics : <b id="clic-${a.id}">0</b></div>
    <button class="btn" id="btn-${a.id}">❤️ CLIQUER POUR SOUTENIR</button>
    <h3>💬 Messages pour ${a.nom}</h3>
    <input id="nom-${a.id}" placeholder="Ton nom">
    <textarea id="txt-${a.id}" placeholder="Laisse un message à l'artiste..."></textarea>
    <button class="btn" style="background:#fff" id="send-${a.id}">Envoyer le message</button>
    <div id="msgs-${a.id}"></div>
  `;
  container.appendChild(div);

  onValue(ref(db, "clics/" + a.id), (snap) => {
    document.getElementById("clic-" + a.id).textContent = snap.val() || 0;
  });

  document.getElementById("btn-" + a.id).onclick = () => {
    runTransaction(ref(db, "clics/" + a.id), (current) => (current || 0) + 1);
  };

  onValue(ref(db, "messages/" + a.id), (snap) => {
    const box = document.getElementById("msgs-" + a.id);
    box.innerHTML = "";
    const data = snap.val();
    if (!data) { box.innerHTML = "<small>Aucun message pour le moment. Sois le premier !</small>"; return; }
    Object.values(data).reverse().forEach(m => {
      const d = document.createElement("div");
      d.className = "msg";
      d.innerHTML = `<b>${m.nom}</b><br>${m.texte}<br><small>${m.date}</small>`;
      box.appendChild(d);
    });
  });

  document.getElementById("send-" + a.id).onclick = () => {
    const nom = document.getElementById("nom-" + a.id).value.trim() || "Anonyme";
    const texte = document.getElementById("txt-" + a.id).value.trim();
    if (!texte) return alert("Écris un message d'abord !");
    const newRef = push(ref(db, "messages/" + a.id));
    set(newRef, { nom, texte, date: new Date().toLocaleString("fr-FR") });
    document.getElementById("txt-" + a.id).value = "";
    alert("Message envoyé !");
  };
});
</script>
</body>
</html>
